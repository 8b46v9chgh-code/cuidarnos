# Una vez por día le hace una consulta de solo lectura a Supabase,
# para que el proyecto del plan Free no se pause por falta de uso (7 días).
# No cambia ningún dato: por la RLS, la respuesta es una lista vacía.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 12 * * *" # todos los días a las 12:00 UTC (9:00 en Argentina)
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          # Datos públicos: son los mismos que usa la app en el navegador.
          SUPABASE_URL: https://stlphethdcmzpopglpvk.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_Fk6QeMRD3STjCTN-SLfxrA__Qcio8p1
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/familias?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
